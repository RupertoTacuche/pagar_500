<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Clientes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
        }
        h1 {
            text-align: center;
            margin-bottom: 24px;
            color: #38bdf8;
            font-size: 24px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #94a3b8;
        }
        input, select {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 18px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 15px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn-guardar {
            background: #38bdf8;
            color: #0f172a;
        }
        .btn-guardar:hover { background: #7dd3fc; }
        .btn-reporte {
            background: #334155;
            color: #e2e8f0;
        }
        .btn-reporte:hover { background: #475569; }
        #mensaje {
            text-align: center;
            margin-top: 14px;
            font-size: 14px;
            color: #4ade80;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Registro de Clientes</h1>
        <form id="formulario">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="servicio">Servicio</label>
            <select id="servicio" name="servicio" required>
                <option value="">Selecciona un servicio</option>
                <option value="Consultoria">Consultoria</option>
                <option value="Desarrollo Web">Desarrollo Web</option>
                <option value="Marketing Digital">Marketing Digital</option>
                <option value="Soporte Tecnico">Soporte Tecnico</option>
            </select>

            <button type="submit" class="btn-guardar">Guardar Cliente</button>
        </form>
        <a href="/generar-reporte" target="_blank">
            <button type="button" class="btn-reporte">Generar Reporte PDF</button>
        </a>
        <div id="mensaje"></div>
    </div>

    <script>
        document.getElementById("formulario").addEventListener("submit", async (e) => {
            e.preventDefault();
            const form = new FormData(e.target);
            const res = await fetch("/guardar-cliente", { method: "POST", body: form });
            const data = await res.json();
            document.getElementById("mensaje").textContent = data.mensaje + ": " + data.nombre;
            e.target.reset();
        });
    </script>
</body>
</html>
